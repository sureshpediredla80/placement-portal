# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=9090

# ===================================================================
# DATASOURCE CONFIGURATION (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/college_placement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================================================
# JPA / HIBERNATE CONFIGURATION
# ==================================================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto= update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================================================================
# CUSTOM JWT SECURITY PARAMETERS
# ===================================================================
# Base64 encoded secret key (min 512-bit for HS512: "placement_management_system_super_secure_ultra_long_token_key_for_production_use_only")


# Access Token expiration: 15 Minutes (in milliseconds: 24*60* 60 * 1000 = 86400000)
app.jwt.expiration-ms=86400000
# Refresh Token expiration: 7 Days (in milliseconds: 7 * 24 * 60 * 60 * 1000 = 604800000)
app.jwt.refresh-expiration-ms=604800000

# ===================================================================
# EMAIL CONFIGURATION
# ===================================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587



spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ==========================================
# AI Configuration
# ==========================================

ai.provider=gemini



ai.timeout=30
ai.base-url=https://generativelanguage.googleapis.com/v1beta/models
ai.model=gemini-2.5-flash